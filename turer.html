<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>Nidaros Geitekor – Turer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- =============== HEADER =============== -->
<header>
    <div class="header-left">
        <img src="img/logo.png" alt="logo">
        <h1>Nidaros Geitekor</h1>
    </div>

    <nav>
        <a href="index.html">Hjem</a>
        <a href="turer.html">Turer</a>
        <a href="kontakt.html">Kontakt</a>
    </nav>
</header>


<!-- =============== KOMMENDE TURER =============== -->
<section class="section">
    <h2>Kommende turer</h2>

    <div class="tour-list">

        <!-- TUR 2026 -->
        <div class="tour-item"
             data-title="Jotunheimen 2026"
             data-image="img/jotunheimen-2026.jpg"
             data-description="Sommeren 2026 planlegger vi en ny fjellturné i Jotunheimen. Det blir vandring, konserter på fjellhytter og sterkt fellesskap. Mer informasjon kommer.">

            <img src="img/jotunheimen-2026.jpg" alt="Jotunheimen 2026">
            
            <div class="tour-text">
                <h3>Jotunheimen 2026</h3>
                <p>Kommende fjelltur</p>
            </div>
        </div>

    </div>
</section>



<!-- =============== TIDLIGERE TURER =============== -->
<section class="section">
    <h2>Tidligere turer</h2>

    <div class="tour-list">

        <!-- TUR 2025 -->
        <div class="tour-item"
             data-title="Jotunheimen 2025"
             data-image="img/GK2025-1.jpg"
             data-description="Vår aller første fjellturné! Turen gikk via Gjendesheim, Glitterheim, Spiterstulen, Leirvassbu, Gjendebu og Bygdin Høifjeldshotel. 11.–16. juli 2025.">

            <img src="img/GK2025-1.jpg" alt="Jotunheimen 2025">
            
            <div class="tour-text">
                <h3>Jotunheimen 2025</h3>
                <p>Fjellturné</p>
            </div>
        </div>

    </div>
</section>



<!-- =============== OVERLAY =============== -->
<div id="tour-overlay" class="tour-overlay">
    <div class="tour-overlay-content">
        <span class="close">&times;</span>

        <img id="overlay-image" src="" alt="">
        <h2 id="overlay-title"></h2>
        <p id="overlay-description"></p>
    </div>
</div>



<!-- =============== FOOTER =============== -->
<footer>
    <p>Nidaros Geitekor • Trondheim • kontakt@nidarosgeitekor.no</p>
</footer>



<!-- =============== JAVASCRIPT =============== -->
<script>
const items = document.querySelectorAll('.tour-item');
const overlay = document.getElementById('tour-overlay');
const overlayTitle = document.getElementById('overlay-title');
const overlayImage = document.getElementById('overlay-image');
const overlayDescription = document.getElementById('overlay-description');
const closeBtn = document.querySelector('.close');

// Åpne overlay
items.forEach(item => {
    item.addEventListener('click', () => {
        overlayTitle.textContent = item.dataset.title;
        overlayImage.src = item.dataset.image;
        overlayDescription.textContent = item.dataset.description;
        overlay.style.display = 'flex';
    });
});

// Lukk overlay
closeBtn.addEventListener('click', () => overlay.style.display = 'none');
overlay.addEventListener('click', (e) => {
    if (e.target === overlay) overlay.style.display = 'none';
});
</script>

</body>
</html>
