<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8" />
    <title>Nidaos Geitekor – Turer</title>

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ================= HEADER ================= -->
<header>
    <div class="header-left">
        <img src="img/logo.png" alt="Logo">
        <h1>Nidaos Geitekor</h1>
    </div>

    <nav>
        <a href="index.html">Hjem</a>
        <a href="turer.html">Turer</a>
        <a href="kontakt.html">Kontakt oss</a>
    </nav>
</header>



<!-- ================= KOMMENDE TURER ================= -->
<section class="section">
    <h2>Kommende turer</h2>

    <div class="tour-grid">

        <!-- KOMMENDE TUR: 2026 -->
        <div class="tour-card"
             data-title="Jotunheimen 2026"
             data-image="img/GK2025-5.jpg"
             data-description="Sommeren 2026 planlegger vi en ny fjellturné i Jotunheimen. Det blir vandring, konserter på fjellhytter og sterkt fellesskap. Mer detaljer kommer.">

            <img src="img/GK2025-5.jpg" alt="Jotunheimen 2026">
            <h3>Jotunheimen 2026</h3>
            <p>Kommende fjellturné</p>
        </div>

    </div>
</section>



<!-- ================= TIDLIGERE TURER ================= -->
<section class="section">
    <h2>Tidligere turer</h2>

    <div class="tour-grid">

        <!-- TIDLIGERE TUR 2025 -->
        <div class="tour-card"
             data-title="Jotunheimen 2025"
             data-image="img/GK2025-1.jpg"
             data-description="Vår aller første fjellturné! Turen gikk innom Gjendesheim, Glitterheim, Spiterstulen, Leirvassbu, Gjendebu og Bygdin Høifjeldshotel. Turen gikk fra 11.–16. juli 2025.">

            <img src="img/GK2025-1.jpg" alt="Jotunheimen 2025">
            <h3>Jotunheimen 2025</h3>
            <p>Fjellturné</p>
        </div>

        <!-- Du kan kopiere og lime inn flere tur-card her -->

    </div>
</section>

<!-- ================= TURBOX (side-by-side) — valgfritt ================= -->
    <div class="section tour-box">
        <div class="tour-image">
            <img src="img/GK2025-1.jpg>
<div id="tour-overlay" class="tour-overlay">
    <div class="tour-overlay-content">
        <span class="close">&times;</span>
        <img id="overlay-image" src="" alt="">
        <h2 id="overlay-title"></h2>
        <p id="overlay-description"></p>
    </div>
</div>



<!-- ================= FOOTER ================= -->
<footer>
    <p>Nidaos Geitekor • Trondheim • kontakt@nidaosgeitekor.no</p>
</footer>



<!-- ================= JAVASCRIPT (overlay) ================= -->
<script>
const cards = document.querySelectorAll('.tour-card');
const overlay = document.getElementById('tour-overlay');
const title = document.getElementById('overlay-title');
const image = document.getElementById('overlay-image');
const description = document.getElementById('overlay-description');
const closeBtn = document.querySelector('.close');

cards.forEach(card => {
    card.addEventListener('click', () => {
        title.textContent = card.dataset.title;
        image.src = card.dataset.image;
        description.textContent = card.dataset.description;
        overlay.style.display = 'flex';
    });
});

closeBtn.addEventListener('click', () => {
    overlay.style.display = 'none';
});

overlay.addEventListener('click', (e) => {
    if (e.target === overlay) {
        overlay.style.display = 'none';
    }
});
</script>

</body>
</html>
''
